name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package + manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./youtube-declutter/manifest.json').version")
          echo "tag=$TAG pkg=$PKG manifest=$MANIFEST"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package.json $PKG"; exit 1; }
          test "$TAG" = "$MANIFEST" || { echo "tag v$TAG != manifest.json $MANIFEST"; exit 1; }

      - run: npm test

      - run: npm run package

      - name: Build deterministic zip
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cd dist && zip -X -o -r "../yt-declutter-${TAG}.zip" . && cd ..
          ls -lh "yt-declutter-${TAG}.zip"
          sha256sum "yt-declutter-${TAG}.zip" | tee "yt-declutter-${TAG}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yt-declutter-*.zip
            yt-declutter-*.zip.sha256
          generate_release_notes: true
          body: |
            ## Install (Chrome / Chromium / Edge / Brave / Opera)

            One file: download `yt-declutter-${{ github.ref_name }}.zip` below, unzip it, then load it once:

            1. Unzip the file.
            2. Open `chrome://extensions`, turn on **Developer mode**.
            3. Click **Load unpacked** and pick the unzipped folder.

            To update later, download the new zip and unzip it over the old folder — settings are kept.

            > Chrome does not allow true one-click installs outside the Chrome Web Store.
            > Unpacked loading is the supported path here (no Web Store account needed).
            > Verify integrity with the `.sha256` file: `sha256sum -c yt-declutter-*.zip.sha256`.
