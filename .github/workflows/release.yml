name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@v4 # 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Verify tag matches package + manifest version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./youtube-declutter/manifest.json').version")
          echo "tag=$TAG pkg=$PKG manifest=$MANIFEST"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package.json $PKG"; exit 1; }
          test "$TAG" = "$MANIFEST" || { echo "tag v$TAG != manifest.json $MANIFEST"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: npm test

      - run: npm run package

      - name: Build deterministic zip
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          rm -f "yt-declutter-${TAG}.zip" "yt-declutter-${TAG}.zip.sha256"
          cd dist
          find . -type f -exec touch -t 198001010000 {} +
          find . -type f | LC_ALL=C sort | zip -X -q "../yt-declutter-${TAG}.zip" -@
          cd ..
          ls -lh "yt-declutter-${TAG}.zip"
          sha256sum "yt-declutter-${TAG}.zip" | tee "yt-declutter-${TAG}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            yt-declutter-${{ steps.version.outputs.tag }}.zip
            yt-declutter-${{ steps.version.outputs.tag }}.zip.sha256
          generate_release_notes: true
          body: |
            ## Install (Chrome / Chromium / Edge / Brave / Opera)

            One file: download `yt-declutter-${{ steps.version.outputs.tag }}.zip` below, unzip it, then load it once:

            1. Unzip the file.
            2. Open `chrome://extensions`, turn on **Developer mode**.
            3. Click **Load unpacked** and pick the unzipped folder.

            To update later, download the new zip and unzip it over the old folder — settings are kept.

            > Chrome does not allow true one-click installs outside the Chrome Web Store.
            > Unpacked loading is the supported path here (no Web Store account needed).
            > Verify integrity with the `.sha256` file: `sha256sum -c yt-declutter-*.zip.sha256`.
