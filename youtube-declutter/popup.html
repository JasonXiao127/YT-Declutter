<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>YouTube Declutter</title>
    <noscript><style>body { visibility: visible !important; }</style></noscript>
</head>
<body>
    <div class="container">
        <header class="popup-header">
            <div class="header-top">
                <h1>YouTube Declutter</h1>
                <span class="enabled-count" id="enabled-count" aria-live="polite"></span>
            </div>
            <div class="search-wrap">
                <input type="search" id="search-input" class="search-input" placeholder="Search settings…" autocomplete="off" aria-label="Search settings">
                <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>
            </div>
        </header>
        <section class="monk-card" id="monk-card" aria-label="Monk Mode">
            <div class="monk-text">
                <span class="monk-title">Monk Mode</span>
                <span class="monk-desc">Only search, subscriptions, and your channels. No feed, Shorts, recommendations, comments, or autoplay.</span>
                <span class="monk-status" id="monk-status" aria-live="polite"></span>
            </div>
            <button type="button" id="monk-button" class="monk-button" aria-pressed="false">Enter Monk Mode</button>
        </section>
        <div class="toggle-list" id="toggle-list"></div>
        <p class="no-results" id="no-results" hidden role="status">No matching settings. <button type="button" id="no-results-clear" class="link-button">Clear search</button></p>
        <footer class="footer-actions">
            <button type="button" id="enable-all" class="action-button" title="Turns on every default-on toggle. The 11 opt-in toggles are not turned on; Monk Mode is never turned on in bulk" aria-label="Enable all default-on toggles; opt-in toggles and Monk Mode are not turned on">Enable all</button>
            <button type="button" id="disable-all" class="action-button" title="Turns everything off — restores YouTube to normal">Disable all</button>
            <button type="button" id="reset-button" class="reset-button" aria-live="polite">Reset to Defaults</button>
        </footer>
        <p class="persist-error" id="persist-error" hidden role="alert">Save failed — changes kept for this session only.</p>
        <p class="footer">Changes apply instantly to loaded tabs. Reload tabs opened before install.</p>
        <p class="version-row" id="version-row"><span id="version-label"></span> <span id="update-status" aria-live="polite"></span></p>
        <noscript><p class="footer">This popup needs JavaScript to load toggles.</p></noscript>
    </div>
    <script src="quality-core.js"></script>
    <script src="features.js"></script>
    <script src="popup.js"></script>
</body>
</html>
